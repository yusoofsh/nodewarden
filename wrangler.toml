name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = false

[vars]
# Registration is closed: the first account on an empty database can still be created.
SIGNUPS_ALLOWED = "false"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden"
database_id = "bd14194a-4ce9-4d34-bd2b-4353fe2d9ee8"

# R2 bucket names cannot be renamed; point this at the existing bucket if it differs.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

# Cloudflare Email Sending, used for mail when MAIL_FROM is set and no HTTP provider is.
# The Workers Free plan delivers only to verified destination addresses.
[[send_email]]
name = "EMAIL"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
